name: Lint and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Lint and test with the SAME scripts the local pre-commit hook uses (.github/scripts), so a
      # local pass and a CI pass mean the same thing. The scripts install PSScriptAnalyzer and
      # Pester 6.x themselves when they're missing.
      - name: Install module dependencies declared in manifests
        shell: pwsh
        run: ./.github/scripts/Install-RequiredModules.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./.github/scripts/Invoke-Lint.ps1

      - name: Run Pester tests
        shell: pwsh
        run: ./.github/scripts/Invoke-PesterTests.ps1 -ResultsPath ./TestResults -Verbosity Detailed

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: TestResults/Pester.xml
